<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>이름 없는 탑 — 텍스트 RPG</title>
<style>
  :root{
    --bg:#0d0f14; --panel:#141821; --panel2:#1b2130; --ink:#e6e8ee; --dim:#8a91a3;
    --line:#2a3143; --gold:#e8c56a; --hp:#e05a5a; --xp:#5aa0e0; --mp:#7ad6c0;
    --accent:#c9a24a; --danger:#e05a5a; --good:#6bcf8a; --shadow:0 10px 30px rgba(0,0,0,.5);
    --font:"Iowan Old Style","Apple SD Gothic Neo","Noto Serif KR",Georgia,serif;
    --mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{ background:radial-gradient(900px 500px at 50% -8%, rgba(200,150,60,.10), transparent 60%),
      radial-gradient(1200px 700px at 50% 0%, #171d2b 0%, var(--bg) 58%) fixed;
    color:var(--ink); font-family:var(--font); line-height:1.6; display:flex; align-items:flex-start; justify-content:center; padding:20px 12px 60px; }
  .wrap{width:100%; max-width:820px}
  h1{font-size:clamp(24px,5vw,38px); letter-spacing:.06em; margin:.1em 0 0; text-align:center; font-weight:600; text-shadow:0 2px 24px rgba(232,197,106,.28)}
  .sub{text-align:center; color:var(--dim); margin:2px 0 14px; font-size:13px; letter-spacing:.24em}
  body:not(.title) h1, body:not(.title) .sub{ display:none }   /* 타이틀 텍스트는 타이틀 화면에서만 (게임 중엔 숨겨 화면 확보) */
  /* 타이틀(시작) 화면: 게임명 크게 + 메뉴 */
  body.title h1{ font-size:clamp(46px,10vw,78px); margin:.4em 0 0; text-shadow:0 3px 34px rgba(232,197,106,.4) }
  body.title .sub{ font-size:15px; letter-spacing:.34em; margin:8px 0 26px }
  body.title .hud, body.title .uibar{ display:none }   /* 타이틀에선 캐릭터 HUD·인벤/스킬 칩 숨김 */
  body.title .foot{ display:none }
  body.title .qtrack, body.title .stage{ display:none }   /* 씬 박스 대신 풀스크린 탑 배경 사용 */
  /* 풀스크린 탑 배경 (인라인 SVG) */
  #titlebg{ position:fixed; inset:0; z-index:0; pointer-events:none; display:none; background:#0a0e1c }
  #titlebg svg{ display:block; width:100%; height:100% }
  #titlebg .titlebgimg{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover }
  body.title #titlebg{ display:block }
  body.title .wrap{ position:relative; z-index:1 }
  body.title h1{ margin-top:9vh }
  body.title .log{ background:transparent; border:none; text-align:center; max-height:none; margin-top:6vh; padding:0 16px }
  body.title .log .quote{ border:none; padding:0; color:#c9d3ea }
  body.title .actions{ max-width:430px; margin:20px auto 0 }
  body.title .actions button{ text-align:center; background:rgba(11,15,24,.72); backdrop-filter:blur(5px); border-color:#2c3350 }
  body.title .actions button:hover:not(:disabled){ background:rgba(20,26,42,.86) }
  body.title .actions button .desc{ text-align:center }
  .ico{border-radius:9px; vertical-align:middle; object-fit:cover; box-shadow:0 2px 6px rgba(0,0,0,.35); background:#0c1017}
  .emo{display:inline-flex; align-items:center; justify-content:center; border-radius:9px; background:#11151f; box-shadow:0 2px 6px rgba(0,0,0,.35); vertical-align:middle}

  .hud{display:grid; grid-template-columns:1.15fr 1fr; gap:10px; margin-bottom:12px}
  .card{background:linear-gradient(180deg,var(--panel),var(--panel2)); border:1px solid var(--line); border-radius:14px; padding:12px 14px; box-shadow:var(--shadow)}
  .pc{display:flex; gap:12px; align-items:center}
  .pc .col{flex:1; min-width:0}
  .row{display:flex; justify-content:space-between; align-items:center; gap:8px; font-size:14px}
  .name{color:var(--gold); font-weight:600; letter-spacing:.03em; cursor:pointer}
  .name::after{content:" ✏️"; font-size:10px; opacity:.5}
  .badge{font-family:var(--mono); font-size:12px; color:var(--dim)}
  .stat{font-family:var(--mono); font-size:12.5px; color:var(--ink); margin-top:6px}
  .bar{height:9px; border-radius:6px; background:#0a0d13; border:1px solid var(--line); overflow:hidden; margin-top:3px}
  .bar > i{display:block; height:100%; transition:width .35s ease}
  .fill-hp{background:linear-gradient(90deg,#8a2b2b,var(--hp))}
  .fill-mp{background:linear-gradient(90deg,#2b6f63,var(--mp))}
  .fill-stam{background:linear-gradient(90deg,#3a6f2b,#8ad06b)}
  .stats5{display:flex; gap:9px; flex-wrap:wrap; font-family:var(--mono); font-size:12px; color:var(--dim); margin-top:8px}
  .stats5 b{color:var(--ink)}
  .mini{display:flex; gap:11px; flex-wrap:wrap; font-family:var(--mono); font-size:12.5px; color:var(--dim)}
  .mini b{color:var(--ink)}
  .matline{display:flex; gap:10px; flex-wrap:wrap; font-family:var(--mono); font-size:12.5px; color:var(--dim); margin-top:7px}
  .matline b{color:var(--gold)}
  .invtitle{color:var(--dim); font-size:11.5px; letter-spacing:.1em; margin:9px 0 4px}
  .invgrid{display:flex; gap:6px; flex-wrap:wrap}
  .eqic{position:relative; display:inline-flex; align-items:center; justify-content:center; width:36px; height:36px}
  .eqic .uplv{position:absolute; right:-4px; bottom:-4px; z-index:3; font-family:var(--mono); font-size:10px; font-style:normal; font-weight:800; line-height:1; color:#1a1408; background:var(--gold); border-radius:5px; padding:1.5px 3.5px; box-shadow:0 0 0 2px #0b0e15; pointer-events:none}
  .empty{color:#5a6072; font-size:12px}

  .stage{position:relative; height:148px; border:1px solid var(--line); border-radius:16px 16px 0 0;
    background:radial-gradient(60% 120% at 50% -20%, rgba(120,90,180,.10), transparent 60%),linear-gradient(180deg,#0f1420,#0a0d14);
    overflow:hidden; display:flex; align-items:center; justify-content:center; text-align:center; transition:background .6s ease}
  /* 제2컨셉존(16~30층) 천공의 성역 — 배경 전환 */
  .stage.zoneSky{ background:radial-gradient(70% 120% at 50% -10%, rgba(255,224,150,.22), transparent 62%),linear-gradient(180deg,#20335c 0%,#16204a 45%,#0c1330 100%); border-color:#33406a }
  .stage.zoneSky .vig{ box-shadow:inset 0 -60px 80px -30px rgba(10,20,50,.6),inset 0 40px 70px -30px rgba(120,150,255,.18) }
  /* 제3컨셉존(31~50층) 시공의 균열 — 우주 배경 */
  .stage.zoneVoid{ border-color:#3a2a5a;
    background:radial-gradient(80% 130% at 50% -10%, rgba(150,90,220,.24), transparent 60%),
      radial-gradient(1.5px 1.5px at 18% 28%, rgba(255,255,255,.7), transparent),radial-gradient(1.5px 1.5px at 72% 44%, rgba(200,220,255,.6), transparent),
      radial-gradient(1px 1px at 40% 70%, rgba(255,255,255,.55), transparent),radial-gradient(1px 1px at 86% 22%, rgba(255,230,255,.6), transparent),
      linear-gradient(180deg,#160a2e 0%,#0a0620 52%,#04030c 100%) }
  .stage.zoneVoid .vig{ box-shadow:inset 0 -60px 80px -30px rgba(20,6,40,.7),inset 0 40px 70px -30px rgba(170,120,255,.16) }
  .stage .vig{position:absolute; inset:0; box-shadow:inset 0 -60px 80px -30px rgba(0,0,0,.7),inset 0 40px 60px -30px rgba(0,0,0,.5); pointer-events:none}
  .stage .floortag{position:absolute; top:8px; left:12px; font-family:var(--mono); font-size:12px; color:var(--dim); letter-spacing:.15em}
  .stage .por-mini{position:absolute; bottom:10px; left:10px; display:flex; align-items:center; gap:6px; font-family:var(--mono); font-size:11px; color:var(--dim)}
  .foe{display:flex; flex-direction:column; align-items:center; gap:8px; z-index:2}
  .foe .art{animation:bob 2.4s ease-in-out infinite; filter:drop-shadow(0 8px 14px rgba(0,0,0,.5))}
  .foe .fname{font-weight:600; font-size:16px}
  .foe .ebar{width:190px; height:10px; border-radius:6px; background:#0a0d13; border:1px solid var(--line); overflow:hidden}
  .foe .ebar > i{display:block; height:100%; background:linear-gradient(90deg,#8a2b2b,#e05a5a); transition:width .3s}
  .intent{position:absolute; top:28px; left:50%; transform:translateX(-50%); font-family:var(--mono); font-size:12.5px; background:#1a1f2c; border:1px solid var(--line); border-radius:20px; padding:4px 12px; z-index:3; white-space:nowrap}
  .intent.heavy{border-color:var(--danger); color:#ffb3b3} .intent.guard{border-color:var(--mp); color:var(--mp)}
  .intent.poison{border-color:#9bd36b; color:#bfe89a} .intent.special{border-color:var(--gold); color:var(--gold)}
  .intent.charge{border-color:#8fd0ff; color:#bfe6ff; box-shadow:0 0 10px rgba(140,200,255,.5); animation:stagpulse .8s ease-in-out infinite}
  .comp{position:absolute; bottom:10px; right:10px; display:flex; flex-direction:column; align-items:center; gap:2px; z-index:3}
  .comp .cn{font-family:var(--mono); font-size:10px; color:var(--dim)}
  .comp .pips{display:flex; gap:3px} .comp .pip{width:6px; height:6px; border-radius:50%; background:#2a3143}
  .comp .pip.on{background:var(--gold); box-shadow:0 0 5px var(--gold)}
  .comp .compemo{font-size:26px; line-height:30px; height:30px; filter:drop-shadow(0 2px 3px rgba(0,0,0,.5))}
  .comp .cn .clv{color:var(--gold); font-size:9px}
  .cbondbar{height:8px; border-radius:6px; background:#141a26; border:1px solid var(--line); overflow:hidden; margin:3px 0}
  .cbondbar i{display:block; height:100%; background:linear-gradient(90deg,#e8c56a,#ffd98a); border-radius:6px}
  .runechip{display:inline-block; font-size:10.5px; background:#1a2030; border:1px solid var(--line); color:var(--mp); border-radius:7px; padding:1px 6px; margin:1px 1px}
  .runechip.empty{color:var(--dim); background:transparent; border-style:dashed}
  .turndiv{display:flex; align-items:center; justify-content:center; gap:8px; text-align:center; font-family:var(--mono); font-size:11.5px; font-weight:700; letter-spacing:.14em; margin:5px 0 2px; padding:2px 0; opacity:.95}
  .turndiv::before,.turndiv::after{content:""; height:1px; flex:1; background:linear-gradient(90deg,transparent,currentColor,transparent); opacity:.5}
  .turndiv.me{color:var(--gold)} .turndiv.foe{color:var(--danger)}
  .turnbanner{position:absolute; left:0; right:0; top:42%; transform:translateY(-50%); z-index:11; pointer-events:none; text-align:center; overflow:hidden}
  .turnbanner span{position:relative; display:inline-block; font-family:var(--mono); font-weight:800; font-size:clamp(28px,7.5vw,48px); letter-spacing:.18em; padding:8px 30px; white-space:nowrap;
    background:linear-gradient(90deg,transparent,rgba(0,0,0,.5) 18%,rgba(0,0,0,.5) 82%,transparent); text-shadow:0 3px 16px rgba(0,0,0,.9), 0 0 22px currentColor;
    animation:turnban 1.05s cubic-bezier(.16,1,.3,1) forwards}
  .turnbanner.me span{color:var(--gold)} .turnbanner.foe span{color:var(--danger)}
  .turnbanner span::before,.turnbanner span::after{content:""; position:absolute; top:50%; width:34px; height:2px; background:currentColor; opacity:.6; transform:translateY(-50%)}
  .turnbanner span::before{right:100%} .turnbanner span::after{left:100%}
  @keyframes turnban{0%{opacity:0; transform:translateX(-56px) skewX(-8deg)}18%{opacity:1; transform:translateX(0) skewX(0)}74%{opacity:1; transform:translateX(0) skewX(0)}100%{opacity:0; transform:translateX(56px) skewX(6deg)}}
  .updbanner{position:fixed; left:0; right:0; top:0; z-index:9999; display:flex; align-items:center; gap:10px; padding:9px 14px;
    background:linear-gradient(180deg,#2a2412,#20242e); border-bottom:1px solid var(--gold); box-shadow:0 4px 18px rgba(0,0,0,.45);
    font-size:13px; color:#f2e6c8; animation:updslide .35s ease-out}
  @keyframes updslide{ from{transform:translateY(-100%)} to{transform:translateY(0)} }
  .updbanner .updmsg{flex:1; min-width:0} .updbanner .updmsg b{color:var(--gold)} .updbanner .upddim{color:var(--dim); font-size:11.5px}
  .updbanner .updbtn{background:var(--gold); color:#1a1405; border:0; border-radius:8px; padding:7px 14px; font-weight:700; cursor:pointer; white-space:nowrap; -webkit-tap-highlight-color:transparent}
  .updbanner .updbtn:hover{filter:brightness(1.08)}
  .updbanner .updx{background:transparent; border:0; color:var(--dim); font-size:15px; cursor:pointer; padding:4px 6px; -webkit-tap-highlight-color:transparent}
  @media (max-width:560px){ .updbanner{font-size:12px; padding:8px 10px} .updbanner .upddim{display:none} }
  /* 포켓몬식 전투 유닛 */
  .bunit{position:absolute; display:flex; align-items:center; gap:10px; z-index:2}
  .bfoe{top:18px; right:14px; flex-direction:row-reverse}
  .bme{bottom:12px; left:14px}
  .bunit .bart{filter:drop-shadow(0 8px 14px rgba(0,0,0,.5))}
  .bfoe .bart{animation:bobSoft 3.6s ease-in-out infinite}   /* GIF는 자체 움직임이 있어 살짝만 */
  @keyframes bobSoft{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
  /* ⚔ 공격 시 앞으로 치고 나가는 모션(플레이어=우상향, 적=좌하향) */
  .bart.lungeMe{animation:lungeMe .26s ease-out !important}
  .bart.lungeFoe{animation:lungeFoe .26s ease-out !important}
  @keyframes lungeMe{0%{transform:translate(0,0)}38%{transform:translate(16px,-13px)}100%{transform:translate(0,0)}}
  @keyframes lungeFoe{0%{transform:translate(0,0)}38%{transform:translate(-16px,13px)}100%{transform:translate(0,0)}}
  /* 🎁 처치 시 상자/장비 드랍 연출 */
  .chestfx{position:absolute; left:62%; top:42%; font-size:40px; z-index:6; pointer-events:none;
    filter:drop-shadow(0 6px 10px rgba(0,0,0,.55)); animation:chestDrop .72s cubic-bezier(.3,1.5,.5,1) both, chestGlow 1.3s ease-in-out .72s infinite}
  .chestfx.boss{font-size:58px; left:57%; top:36%}
  @keyframes chestDrop{0%{transform:translateY(-96px) scale(.55); opacity:0}42%{opacity:1}62%{transform:translateY(7px) scale(1.06)}80%{transform:translateY(-6px) scale(.97)}100%{transform:translateY(0) scale(1); opacity:1}}
  @keyframes chestGlow{0%,100%{filter:drop-shadow(0 6px 10px rgba(0,0,0,.55))}50%{filter:drop-shadow(0 0 17px rgba(255,214,106,.92)) brightness(1.18)}}
  .chestspark{position:absolute; z-index:6; pointer-events:none; font-size:16px; animation:chestSpark .9s ease-out forwards}
  @keyframes chestSpark{0%{opacity:0; transform:translate(0,0) scale(.4)}25%{opacity:1}100%{opacity:0; transform:translate(var(--sx),var(--sy)) scale(1)}}
  .summ{position:absolute; left:18px; bottom:104px; display:flex; align-items:center; gap:6px; z-index:3; background:#171326cc; border:1px solid #4a3d6e; border-radius:10px; padding:4px 8px; backdrop-filter:blur(2px); animation:bob 2.8s ease-in-out infinite; max-width:170px}
  .summ.guarding{border-color:#7ad6c0; box-shadow:0 0 9px #7ad6c0aa}
  .summ .se{font-size:22px; line-height:1; filter:drop-shadow(0 4px 8px rgba(0,0,0,.5))}
  .summ .sn{font-size:11px; font-weight:600; color:#c9a9ff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:120px}
  .summ .smeta{font-family:var(--mono); font-size:9px; color:var(--dim)}
  .cardpick .cprow{display:flex; gap:12px; justify-content:center; margin-top:10px}
  .pcard{width:72px; height:100px; cursor:pointer; perspective:600px; transition:transform .14s}
  .pcard:hover{transform:translateY(-6px)}
  .pcard .pcinner{position:relative; width:100%; height:100%; transform-style:preserve-3d; transition:transform .5s}
  .pcard.flip .pcinner{transform:rotateY(180deg)}
  .pcard.dim{opacity:.28; pointer-events:none}
  .pcard .pcback,.pcard .pcface{position:absolute; inset:0; border-radius:10px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; backface-visibility:hidden; -webkit-backface-visibility:hidden; border:1px solid #4a3d6e}
  .pcard .pcback{background:linear-gradient(135deg,#2a2148,#171326); gap:6px}
  .pcard .pcback .pze{font-size:28px} .pcard .pcback .pzn{font-size:12px; font-weight:700; letter-spacing:1px}
  .pcard .pcface{background:linear-gradient(135deg,#1b2436,#131824); transform:rotateY(180deg)}
  .pcard .pce{font-size:26px} .pcard .pcn{font-size:10.5px; font-weight:600; color:#c9a9ff; text-align:center} .pcard .pck{font-size:9px; color:var(--dim); font-family:var(--mono)}
  .circlecast .glyph{position:relative; width:170px; height:170px; margin:8px auto 4px}
  .circlecast .glines{position:absolute; inset:0; width:100%; height:100%; pointer-events:none}
  .circlecast .glines polyline{fill:none; stroke:#c9a9ff; stroke-width:1.4; filter:drop-shadow(0 0 3px #c9a9ff); opacity:.9}
  .circlecast .rune{position:absolute; transform:translate(-50%,-50%); width:26px; height:26px; margin:0; display:flex; align-items:center; justify-content:center; border-radius:50%; background:#171326; border:1px solid #4a3d6e; color:#6a5c96; font-size:14px; cursor:pointer; transition:transform .1s, box-shadow .15s, color .15s}
  .circlecast .rune.next{color:#ffe08a; border-color:#ffd36a; box-shadow:0 0 10px #ffd36a; transform:translate(-50%,-50%) scale(1.25)}
  .circlecast .rune.lit{color:#c9a9ff; border-color:#c9a9ff; box-shadow:0 0 8px #c9a9ff}
  .circlecast .rune.bad{color:#ff8a8a; border-color:#a33; animation:shake .25s}
  .ubox{background:#131824cc; border:1px solid var(--line); border-radius:10px; padding:6px 10px; min-width:148px; backdrop-filter:blur(2px)}
  .ubox .un{font-size:12.5px; font-weight:600; margin-bottom:4px}
  .ubox .weakb{font-size:9.5px; font-weight:700; margin-left:5px; padding:1px 5px; border:1px solid currentColor; border-radius:6px; opacity:.9}
  .ailrow{display:flex; gap:5px; margin:-1px 0 4px} .ailrow .ailb{font-family:var(--mono); font-size:10px; font-weight:700; padding:1px 5px; border-radius:6px; background:#0a0d13; border:1px solid var(--line)}
  .ubox .mechb{font-size:9.5px; font-weight:700; margin-left:5px; padding:1px 5px; border:1px solid #3a4460; border-radius:6px; color:#a9b6d6; opacity:.9}
  .ubox .mechb.hot{color:#ff8a8a; border-color:#a33; animation:mompulse 1s ease-in-out infinite}
  .ubox .flyb{font-size:9.5px; font-weight:700; margin-left:5px; padding:1px 5px; border:1px solid #6aa0d6; border-radius:6px; color:#8fd0ff; opacity:.95}
  .hpbar2.shd>i{background:linear-gradient(90deg,#3a6ea8,#8fd0ff)}
  .hprow{display:flex; align-items:center; gap:6px; margin-top:3px}
  .hprow .tag{font-family:var(--mono); font-size:9px; color:var(--dim); width:22px}
  .hpbar2{flex:1; height:8px; border-radius:5px; background:#0a0d13; border:1px solid var(--line); overflow:hidden}
  .hpbar2>i{display:block; height:100%; transition:width .3s}
  .hpbar2.hp>i{background:linear-gradient(90deg,#8a2b2b,var(--hp))}
  .hpbar2.mp>i{background:linear-gradient(90deg,#2b6f63,var(--mp))}
  .hpbar2.mom>i{background:linear-gradient(90deg,#a8791f,#ffd36a)}
  .hpbar2.mom.full{border-color:#ffd36a; box-shadow:0 0 8px #ffd36a99; animation:mompulse 1s ease-in-out infinite}
  .hpbar2.mom.full>i{background:linear-gradient(90deg,#ffd36a,#fff2c4)}
  @keyframes mompulse{0%,100%{box-shadow:0 0 6px #ffd36a77}50%{box-shadow:0 0 12px #ffd36a}}
  .hpbar2.grog{height:6px} .hpbar2.grog>i{background:linear-gradient(90deg,#8a6a1e,#e8c56a)}
  .hpbar2.brk{height:8px; border-color:#8fd0ff; box-shadow:0 0 8px rgba(140,200,255,.55)} .hpbar2.brk>i{background:linear-gradient(90deg,#2b6f8a,#8fd0ff)}
  .bart.charging{animation:chargeAura 1s ease-in-out infinite !important}
  @keyframes chargeAura{0%,100%{filter:drop-shadow(0 8px 14px rgba(0,0,0,.5))}50%{filter:drop-shadow(0 0 20px rgba(140,200,255,.95)) brightness(1.35)}}
  .hpbar2.grog.stag{border-color:var(--gold); box-shadow:0 0 8px var(--gold); animation:stagpulse .6s ease-in-out infinite}
  .hpbar2.grog.stag>i{background:linear-gradient(90deg,#ffd36a,#fff)}
  @keyframes stagpulse{0%,100%{box-shadow:0 0 6px var(--gold)}50%{box-shadow:0 0 14px var(--gold)}}
  .hpnum{font-family:var(--mono); font-size:10px; color:var(--dim); min-width:48px; text-align:right}
  @media (max-width:560px){ .ubox{min-width:118px} .hpnum{min-width:40px; font-size:9px} }

  .log{padding:16px 18px 6px; max-height:44vh; overflow-y:auto; font-size:15.5px; background:#0c0f16; border-left:1px solid var(--line); border-right:1px solid var(--line)}
  /* 전투 중: 정석 분리형 — 씬(상) / 메시지박스 3줄(중) / 커맨드박스(하) 를 겹침 없이 쌓는다 */
  body.combat .stage{ height:340px; border-radius:14px 14px 0 0 }   /* 스프라이트 키운 만큼 전투 화면 확대 */

  /* 💬 포켓몬식 대화박스: 고정 높이 + 최신 줄 강조 + 높은 대비 (가독성↑) */

    -webkit-mask-image:linear-gradient(180deg, transparent 0, #000 24px, #000 100%); mask-image:linear-gradient(180deg, transparent 0, #000 24px, #000 100%) }   /* 위로 넘친 옛 줄은 하드컷 대신 페이드 */

  .log .dmg{color:#ff8f8f; font-family:var(--mono); font-size:14.5px}

  /* 💬 전투 메시지 박스 하나로 통일 (스테이지 위) — 전투 중엔 아래 로그 숨기고 이 박스만 */
